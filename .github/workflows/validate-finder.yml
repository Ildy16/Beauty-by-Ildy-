name: Validate Beauty Finder

on:
  push:
    branches:
      - recovery/work-restoration-2026-09-06
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Finder tests
        run: npm run test:finder
      - name: Production build
        run: npm run build
